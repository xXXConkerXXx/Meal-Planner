<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="mode-breakfast">
    <header>
        <div class="month-nav">
            <button type="button" class="nav-arrow" onclick="changeMonth(-1)">◀ Prev</button>
            <h1 id="month-title">Loading...</h1>
            <button type="button" class="nav-arrow" onclick="changeMonth(1)">Next ▶</button>
        </div>

        <div class="header-controls">
            <span id="season-badge"></span>
            <select id="theme-select" onchange="setTheme(this.value)">
                <option value="system">Theme: System</option>
                <option value="light">Theme: Light</option>
                <option value="dark">Theme: Dark</option>
            </select>
            <button type="button" class="btn-outline" onclick="openGuideModal()">Guide &amp; Tips</button>
            <button type="button" class="btn-outline" onclick="toggleKioskMode()">Kitchen Mode</button>
            <span class="control-divider"></span>
            <button type="button" class="btn-outline" onclick="document.getElementById('json-loader').click()">Load meals.json</button>
            <button type="button" class="btn-outline" onclick="exportToFile()">Save meals.json</button>
            <input type="file" id="json-loader" accept=".json" class="hidden" onchange="importFromFile(event)">
        </div>

        <div class="view-switcher">
            <button type="button" class="view-btn active" onclick="switchView('preview', this)">Preview Calendar</button>
            <button type="button" class="view-btn" onclick="switchView('edit', this)">Edit &amp; Place Meals</button>
            <button type="button" class="view-btn" onclick="switchView('grocery', this)">Weekly Grocery List</button>
        </div>
    </header>

    <button type="button" id="exit-kiosk-btn" class="hidden" onclick="toggleKioskMode()">Exit Kitchen Mode</button>

    <div id="preview-view">
        <div class="calendar-bar screen-only">
            <nav class="tabs">
                <button type="button" class="tab active" onclick="switchTab('breakfast', this)">Breakfast</button>
                <button type="button" class="tab" onclick="switchTab('lunch', this)">Lunch</button>
                <button type="button" class="tab" onclick="switchTab('dinner', this)">Dinner</button>
            </nav>

            <div class="calendar-actions">
                <button type="button" onclick="clearCurrentMonth(this)" class="btn-outline">Clear Month</button>
				<button type="button" class="btn-outline" onclick="clearCurrentYear(this)">Clear Year</button>
				<button type="button" class="btn-outline" onclick="clearAllPlans(this)">Clear All</button>
                <button type="button" onclick="printAllCalendars()" class="btn-outline">Print All 3 Calendars</button>
            </div>
        </div>

        <main class="calendar-wrapper screen-only">
            <div class="weekdays">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div id="calendar-grid" class="calendar-grid"></div>
        </main>

        <div id="print-all-calendars" class="print-only"></div>
    </div>

    <div id="edit-view" class="hidden">
        <div class="edit-grid">
            <section class="panel">
                <h2 id="form-heading">1. Add Dish</h2>
                <form id="meal-form" class="stacked-form" autocomplete="off">
                    <label>Dish Name</label>
                    <input type="text" id="meal-name" placeholder="e.g., Crawfish Étouffée or Sweet Corn" required>

                    <label>Dish Role</label>
                    <select id="meal-role">
                        <option value="main">Main Dish</option>
                        <option value="side">Side Dish (e.g., Corn, Green Beans, Rice)</option>
                    </select>

                    <label>Recipe Website Link (Optional)</label>
                    <input type="url" id="meal-url" placeholder="https://example.com">

                    <label>Ingredients with Measurements (One per line: Amount + Unit + Item)</label>
                    <textarea id="meal-items" rows="5" placeholder="2 lbs Crawfish tails&#10;1 stick Butter&#10;1/2 tsp Cayenne pepper" required></textarea>

                    <div class="form-row">
                        <div class="field-group">
                            <label>Meal Time</label>
                            <div id="meal-type-checks" class="checks">
                                <label><input type="checkbox" value="breakfast" checked> Breakfast</label>
                                <label><input type="checkbox" value="lunch" checked> Lunch</label>
                                <label><input type="checkbox" value="dinner" checked> Dinner</label>
                            </div>
                        </div>

                        <div class="field-group">
                            <label>Seasons</label>
                            <div id="meal-season-checks" class="checks">
                                <label><input type="checkbox" value="spring" checked> Spring</label>
                                <label><input type="checkbox" value="summer" checked> Summer</label>
                                <label><input type="checkbox" value="fall" checked> Fall</label>
                                <label><input type="checkbox" value="winter" checked> Winter</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="save-dish-btn" class="btn-full">Save Dish</button>
                        <button type="button" id="cancel-edit-btn" class="btn-outline hidden" onclick="cancelEditDish()">Cancel</button>
                    </div>
                </form>
            </section>

            <section class="panel">
                <h2>2. Place Meals (<span id="edit-month-label"></span>)</h2>
                <div class="stacked-form">
                    <label>Meal Slot</label>
                    <select id="assign-slot" onchange="updateAssignMealDropdown()">
                        <option value="breakfast">Breakfast</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                    </select>

                    <label>Choose Main Dish</label>
                    <select id="assign-meal"></select>

                    <label>Placement Pattern</label>
                    <select id="assign-pattern" onchange="togglePatternInputs()">
                        <option value="single">Single Specific Day</option>
                        <option value="weekday-month">Every Selected Weekday in This Month</option>
                        <option value="weekday-year">Every Selected Weekday All Year</option>
                        <option value="scatter-month">Scatter Randomly (1 Per Week This Month)</option>
                    </select>

                    <div id="single-day-box">
                        <label>Select Day</label>
                        <select id="assign-day"></select>
                    </div>

                    <div id="weekday-box" class="hidden">
                        <label>Select Day of the Week</label>
                        <select id="assign-weekday">
                            <option value="0">Every Sunday</option>
                            <option value="1">Every Monday</option>
                            <option value="2">Every Tuesday</option>
                            <option value="3">Every Wednesday</option>
                            <option value="4">Every Thursday</option>
                            <option value="5">Every Friday</option>
                            <option value="6">Every Saturday</option>
                        </select>
                    </div>

                    <button type="button" onclick="applyMealPlacement()" class="btn-green btn-full">Apply to Calendar</button>
                </div>

                <hr class="divider">
                <button type="button" class="btn-outline btn-full" onclick="openSavedDishesModal()">
                    Manage Saved Dishes (<span id="recipe-count">0</span>)
                </button>
            </section>
        </div>
    </div>

    <div id="grocery-view" class="hidden">
        <section class="panel grocery-panel">
            <div class="grocery-header">
                <div>
                    <h2>Weekly Grocery List</h2>
                    <p id="grocery-week-label" class="subtitle"></p>
                </div>
                <div class="week-controls">
                    <button type="button" class="nav-arrow" onclick="changeGroceryWeek(-1)">◀ Prev Week</button>
                    <button type="button" class="nav-arrow" onclick="changeGroceryWeek(1)">Next Week ▶</button>
                    <button type="button" onclick="window.print()" class="btn-green">Print List</button>
                </div>
            </div>
            <div id="grocery-summary" class="grocery-list-container"></div>
        </section>
    </div>

    <script src="scripts/storage.js"></script>
    <script src="scripts/ui.js"></script>
	<script src="scripts/recipes.js"></script>
    <script src="scripts/dict-dishes.js"></script>
    <script src="scripts/dict-ingredients.js"></script>
    <script src="scripts/recipe-dictionary.js"></script>
    <script src="scripts/recipe-fuzzy-match.js"></script>
    <script src="scripts/recipe-autocomplete.js"></script>
    <script src="scripts/saved-modal.js"></script>
    <script src="scripts/pantry-matcher.js"></script>
    <script src="scripts/calendar.js"></script>
    <script src="scripts/modal-extras.js"></script>
    <script src="scripts/modal.js"></script>
    <script src="scripts/guide.js"></script>
    <script src="scripts/grocery-aisles.js"></script>
    <script src="scripts/grocery.js"></script>
	
	<script src="scripts/holidays/holiday-rules.js"></script>
    <script src="scripts/holidays/holiday-repeat-store.js"></script>
    <script src="scripts/holidays/assign-sides-picker.js"></script>
    <script src="scripts/holidays/holiday-repeat-list.js"></script>
    <script src="scripts/holidays/holiday-meals.js"></script>

    <script src="scripts/holidays/holiday-display.js"></script>
    <script src="scripts/holidays/favicon-live.js"></script>
    <script src="scripts/holidays/audio-notes.js"></script>
    <script src="scripts/holidays/audio-songs-h1.js"></script>
    <script src="scripts/holidays/audio-songs-h2.js"></script>
    <script src="scripts/holidays/audio-songs-extra-h1.js"></script>
    <script src="scripts/holidays/audio-songs-extra-q3.js"></script>
    <script src="scripts/holidays/audio-songs-extra-q4.js"></script>
    <script src="scripts/holidays/audio-instruments.js"></script>
    <script src="scripts/holidays/audio-arranger.js"></script>
    <script src="scripts/holidays/audio-engine.js"></script>
    <script src="scripts/holidays/holiday-audio.js"></script>
	
    <script src="scripts/decorations/3d-geometry.js"></script>
    <script src="scripts/decorations/3d-models-autumn.js"></script>
    <script src="scripts/decorations/3d-models-winter.js"></script>
    <script src="scripts/decorations/3d-models-spring-summer.js"></script>
    <script src="scripts/decorations/3d-models.js"></script>
    <script src="scripts/decorations/3d-physics.js"></script>
	<script src="scripts/decorations/3d-scene.js"></script>
    <script src="scripts/decorations/3d-firework-audio.js"></script>
    <script src="scripts/decorations/3d-countdown-targets.js"></script>
    <script src="scripts/decorations/3d-firework-particles.js"></script>
    <script src="scripts/decorations/3d-clock-widget.js"></script>
    <script src="scripts/decorations/3d-countdown.js"></script>
    <script src="scripts/decorations/3d-showcase-mode.js"></script>
</body>
</html>
